<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kage — Where stillness reveals the unseen</title>
<meta name="theme-color" content="#080808">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080808'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e0231c'/%3E%3C/svg%3E">
<!-- import "@designcodeio/threeui/style.css" -->
<link rel="stylesheet" href="threeui.css">
<style>
  html, body { margin: 0; height: 100%; background: #080808; }
  /* The configured usage wraps the component in .shader-frame; here it fills the window. */
  .shader-frame { position: fixed; inset: 0; }
</style>
</head>
<body>
<!--
  Static equivalent of the configured usage:

    <div className="shader-frame">
      <KageLandingPage headingFont="onest" bodyFont="onest" headingWeight="400" bodyWeight="300"
        primaryColor="#e0231c" headingSize={46} bodySize={17} headingLetterSpacing={-0.012} />
    </div>

  KageLandingPage renders LandingPageFrame (src/shaders/landing-pages/LandingPageFrame.tsx): the packaged,
  byte-exact landing-pages/kage.html in a sandboxed iframe, with the typography/colour customization from
  KAGE_TYPOGRAPHY (pageRecipes.ts) appended to the frame's own <head> on load (pageTypography.ts).
-->
<div class="shader-frame">
  <div class="threeui-background landing-page-frame" data-state="loading"
       style="position: relative; overflow: hidden; background: #080808; pointer-events: auto;">
    <iframe id="kageFrame" title="Kage — Where stillness reveals the unseen" src="landing-pages/kage.html"
            sandbox="allow-downloads allow-forms allow-modals allow-popups allow-same-origin allow-scripts"
            loading="eager"
            style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #080808; opacity: 1; pointer-events: auto;"></iframe>
  </div>
</div>

<script>
(function () {
  // KAGE_TYPOGRAPHY.css resolved for the configured props
  // (onest / onest, 400 / 300, #e0231c, 46, 17, -0.012). Onest is carried by the page, so no font link is added.
  var ONEST = "'Onest', system-ui, -apple-system, 'Helvetica Neue', sans-serif";
  var customization = {
    css: "\n:root {\n  --vermilion: #e0231c;\n  --ember: #ff5a3c;\n}\n" +
      "body { font-family: " + ONEST + "; }\n" +
      "body, .body, .body-lg, .num { font-weight: 300; }\n" +
      "h1:not(.jp), h2:not(.jp), h3:not(.jp), .display:not(.jp) {\n  font-family: " + ONEST + ";\n  font-weight: 400;\n}\n" +
      ".display { letter-spacing: -0.012em; }\n" +
      ".h-hero { font-size: clamp(26px, 3.05vw, 46px); }\n" +
      ".h-sec { font-size: clamp(30px, 4vw, 60px); }\n" +
      ".body-lg { font-size: clamp(14px, 1.02vw, 17px); }\n" +
      ".body { font-size: 14px; }\n",
    fontHref: undefined
  };

  var STYLE_ID = "threeui-page-typography";
  var FONT_LINK_ID = "threeui-page-typography-fonts";
  var MESSAGE_TYPE = "threeui-page-customization";

  // applyPageCustomization: appended to the frame's own head, so the packaged file stays byte-exact.
  function applyPageCustomization(frame, c) {
    var doc = frame && frame.contentDocument;
    if (!doc || !doc.head) return;
    var existingLink = doc.getElementById(FONT_LINK_ID);
    if (c && c.fontHref) {
      var link = existingLink || doc.createElement("link");
      link.id = FONT_LINK_ID; link.rel = "stylesheet";
      if (link.getAttribute("href") !== c.fontHref) link.href = c.fontHref;
      if (!existingLink) doc.head.append(link);
    } else if (existingLink) {
      existingLink.remove();
    }
    if (!c || !c.css) { var old = doc.getElementById(STYLE_ID); if (old) old.remove(); return; }
    var style = doc.getElementById(STYLE_ID) || doc.createElement("style");
    style.id = STYLE_ID;
    if (style.textContent !== c.css) style.textContent = c.css;
    doc.head.append(style);
  }

  // postPageCustomization: the same contract for frames that listen for it.
  function postPageCustomization(frame, c) {
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage({ type: MESSAGE_TYPE, css: (c && c.css) || "", fontHref: c && c.fontHref }, "*");
    }
  }

  var frame = document.getElementById("kageFrame");
  frame.addEventListener("load", function () {
    applyPageCustomization(frame, customization);
    postPageCustomization(frame, customization);
    frame.parentElement.setAttribute("data-state", "ready");
  });
})();
</script>
</body>
</html>
