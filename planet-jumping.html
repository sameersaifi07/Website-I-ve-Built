<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Jumping</title>
<meta name="description" content="An immersive journey from Mars to Earth to Venus through a portal.">
<meta name="theme-color" content="#090807">
<link rel="icon" href="data:,">
<style>
/* ---------- 2. Fonts (local only: no network requests, fallbacks keep the layout) ---------- */
@font-face { font-family: "SF Pro"; font-weight: 400; src: local("SF Pro Text"), local("SF Pro Display"), local("SFProText-Regular"), local("SF Pro"); }
@font-face { font-family: "SF Pro"; font-weight: 700; src: local("SF Pro Text Bold"), local("SF Pro Display Bold"), local("SFProText-Bold"); }
@font-face { font-family: "SF Pro Thin"; font-weight: 100; src: local("SF Pro Display Thin"), local("SFProDisplay-Thin"), local("SF Pro Thin"); }
@font-face { font-family: "Aalto"; font-weight: 400; src: local("Aalto"), local("Aalto-Regular"); }

:root { font-family: 'SF Pro', Arial, sans-serif; color: #fff; background: #090807; font-synthesis: none; }

/* ---------- 5. Layout ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
.experience { position: relative; width: 100%; height: 100%; min-height: 540px; overflow: hidden; background: #0a0908; }
.backgrounds, .background, .shade, .transition-layer, .transition-layer video { position: absolute; inset: 0; width: 100%; height: 100%; }
.background { object-fit: cover; opacity: 0; transition: opacity .8s ease; }
.background.is-visible { opacity: 1; }
.shade { z-index: 1; background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%); pointer-events: none; }
.chrome { position: absolute; z-index: 4; transition: opacity .45s ease, filter .45s ease; }
.experience.is-transitioning .chrome { opacity: 0; filter: blur(8px); pointer-events: none; }

/* Header */
.header { left: clamp(18px, 1.95vw, 28px); right: clamp(18px, 1.95vw, 28px); top: clamp(18px, 3.1vh, 28px); display: flex; justify-content: space-between; align-items: center; }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.nav { display: flex; align-items: center; height: 42px; padding: 4px 5px; border: 1px solid rgba(255, 255, 255, .45);
  background: rgba(255, 255, 255, .1); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 999px; }
.nav a { color: #fff; text-decoration: none; padding: 8px 19px; border-radius: 999px; line-height: 1; }
.nav a.active { background: #fff; color: #000; }
.menu { height: 42px; padding: 0 20px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; font: inherit; }
/* Highlighted creator credit, centred in the header */
.credit { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 16px; border: 1px solid rgba(255, 255, 255, .45); border-radius: 999px; white-space: nowrap;
  background: rgba(255, 255, 255, .1); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 13px; }
.credit:before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; }
.credit strong { font-weight: 700; }

/* Sidebar */
.planet-list { left: clamp(18px, 1.95vw, 28px); top: 50%; transform: translateY(-43%); display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.planet-item { display: flex; align-items: center; min-height: 20px; }
.planet-item.active { font-size: 18px; font-weight: 700; gap: 8px; }
.planet-item.active:before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: #fff; }

/* Portal */
.portal-wrap { left: 50%; top: 50%; width: min(320px, 31vw); transform: translate(-50%, -54%); perspective: none; }
.portal-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; opacity: 0; }
.portal-heading strong { font-size: 18px; margin-left: 8px; }
.portal { position: relative; display: block; width: 100%; aspect-ratio: 320 / 350; padding: 0; overflow: visible; border: 0;
  border-radius: 90px; background: transparent; cursor: pointer; box-shadow: none; transform: none !important; color: inherit; }
.portal:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
.portal video, .portal img { visibility: hidden; position: absolute; width: 1px; height: 1px; pointer-events: none; }
.portal-canvas { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }

/* Content */
.planet-content { left: clamp(28px, 4vw, 58px); right: clamp(28px, 3vw, 44px); bottom: clamp(24px, 3vh, 30px);
  display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
.planet-content h1 { font-family: Aalto, 'Arial Narrow', sans-serif; font-size: clamp(128px, 21.8vw, 314px);
  font-weight: 400; line-height: .72; margin: 0 0 -.04em; letter-spacing: 0; transform: translateX(-32px); opacity: 0; }
.planet-content dl { width: min(447px, 34vw); margin: 0; font-size: 16px; flex-shrink: 0; }
.fact { display: grid; grid-template-columns: 138px 1fr; gap: 18px; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, .48); opacity: 0; }
.fact:last-child { border-bottom: 0; }
.fact dt { font-weight: 700; }
.fact dd { margin: 0; }

/* Misc */
.transition-layer { display: none; }
.scene-canvas { display: none; }
.loading { position: absolute; z-index: 12; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; transition: opacity .2s; pointer-events: none; }
.experience.is-loading .loading { opacity: .8; }
.experience.is-transitioning .header, .experience.is-transitioning .planet-list { opacity: 1; filter: none; pointer-events: auto; }
.experience.is-transitioning .shade { opacity: 1; }
.experience.is-committing .background { transition: none !important; }

/* ---------- 6. Preloader ---------- */
.preloader { position: absolute; inset: 0; z-index: 20; background: #000; overflow: hidden; }
.preloader video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.preloader-shade { position: absolute; inset: auto 0 0; height: 35%; background: linear-gradient(to bottom, transparent, #000); transition: opacity .8s ease; }
.preloader.is-background { z-index: 0; }
.preloader.is-background .preloader-shade { opacity: 0; }
.floating-logo { position: fixed; z-index: 22; left: 50%; top: 50%; width: 59px; height: 58px; transform: translate(-50%, -50%);
  will-change: left, top, width, height, transform;
  transition: left 2s cubic-bezier(.16, 1, .3, 1), top 2s cubic-bezier(.16, 1, .3, 1), width 2s cubic-bezier(.16, 1, .3, 1),
              height 2s cubic-bezier(.16, 1, .3, 1), transform 2s cubic-bezier(.16, 1, .3, 1); }
.floating-logo.is-docked { left: clamp(18px, 1.95vw, 28px); top: clamp(18px, 3.1vh, 28px); width: 37px; height: 36px; transform: none; }
.floating-logo.is-settled { z-index: 5; }
.preloader-count { position: fixed; z-index: 22; left: 50%; bottom: clamp(22px, 3.1vh, 28px); display: flex; align-items: flex-end;
  gap: 4px; transform: translateX(-50%); font-family: 'SF Pro', Arial, sans-serif; line-height: 1; font-variant-numeric: tabular-nums; }
.preloader-count > span:first-child { font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif; font-size: 64px; font-weight: 100; }
.preloader-count .percent { font-size: 24px; padding-bottom: 4px; }
.preloader-count.is-leaving { animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes preload-count-out { to { opacity: 0; filter: blur(7px); transform: translate(-50%, -34px); } }
body:not(.preload-complete) .custom-cursor { opacity: 0 !important; }

/* ---------- 9. Custom cursor ---------- */
html, body, button, a, .portal { cursor: none !important; }
.custom-cursor { display: block; position: fixed; left: 0; top: 0; z-index: 100; width: 1px; height: 1px;
  pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.custom-cursor.is-visible { opacity: 1; }
.cursor-dot, .cursor-orbit { position: absolute; left: 0; top: 0; border-radius: 50%; transform: translate(-50%, -50%); }
.cursor-dot { width: 12px; height: 12px; background: #fff; }
.cursor-orbit { width: 36px; height: 36px; border: 1px solid #fff; background: rgba(255, 255, 255, .4);
  transition: transform .3s cubic-bezier(.22, 1, .36, 1); }
.custom-cursor.is-enter .cursor-orbit { transform: translate(-50%, -50%) scale(1.16); }
.cursor-label { position: absolute; top: 26px; left: 0; transform: translateX(-50%) translateY(-4px);
  font: 16px/1.2 'SF Pro', Arial, sans-serif; white-space: nowrap; opacity: 0;
  transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1); }
.custom-cursor.is-enter .cursor-label { opacity: 1; transform: translateX(-50%) translateY(0); }
/* Touch screens have no hover pointer: keep the native behaviour and hide the custom cursor */
@media (hover: none) { .custom-cursor { display: none; } }

/* ---------- 10. Entrance / switch animations ---------- */
body:not(.intro-ready) .header, body:not(.intro-ready) .planet-list { opacity: 0; }
.intro-ready .header { animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both; }
.intro-ready .planet-list { animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both; }
.content-revealing h1 { animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both; }
.content-revealing .fact { animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both; }
.content-revealing .fact:nth-child(1) { animation-delay: .52s; }
.content-revealing .fact:nth-child(2) { animation-delay: .68s; }
.content-revealing .fact:nth-child(3) { animation-delay: .84s; }
.content-revealing .fact:nth-child(4) { animation-delay: 1s; }
.mask-revealing .portal-heading { animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both; }
.planet-list.is-switching .planet-item { animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both; }
.planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
.planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
.planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
.planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
.planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
.planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
.planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
.planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }
.planet-list.is-switching .planet-item.active:before { animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both; }

@keyframes reveal-down { from { opacity: 0; filter: blur(8px); transform: translateY(-18px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes reveal-side { from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); } to { opacity: 1; filter: blur(0); transform: translate(0, -43%); } }
@keyframes title-rise { from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); } to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); } }
@keyframes fact-rise { from { opacity: 0; filter: blur(7px); transform: translateY(18px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes portal-caption { from { opacity: 0; filter: blur(7px); transform: translateY(22px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes menu-row { from { opacity: .35; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
@keyframes active-dot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

/* ---------- 11. Responsive ---------- */
@media (max-width: 900px) {
  .nav { display: none; }
  .portal-wrap { width: min(300px, 48vw); }
  .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
  .planet-content dl { width: 43vw; }
  .fact { grid-template-columns: 110px 1fr; }
  .planet-list { font-size: 14px; }
  .planet-item.active { font-size: 16px; }
}
@media (max-width: 640px) {
  .experience { min-height: 600px; }
  .planet-list { display: none; }
  .portal-wrap { top: 44%; width: min(260px, 66vw); }
  .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
  .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
  .planet-content dl { width: 100%; font-size: 13px; }
  .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
  .portal-heading { font-size: 14px; }
  .portal-heading strong { font-size: 16px; }
  .menu { height: 38px; }
  .credit { height: 30px; padding: 0 12px; font-size: 11px; gap: 6px; }
  .portal { border-radius: 70px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
  .portal { transform: none !important; }
}
</style>
</head>
<body>
<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background" class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
    <video id="venus-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
  </div>
  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
    <div class="preloader-shade"></div>
  </div>
  <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural">
  <div class="preloader-count" id="preloader-count" aria-live="polite">
    <span id="preloader-value">0</span><span class="percent">%</span>
  </div>
  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <header class="header chrome">
    <span class="credit">Created by <strong>Sameer Saifi</strong></span>
    <div class="header-actions">
      <nav class="nav" aria-label="Primary navigation">
        <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
      </nav>
      <button class="menu" type="button">Menu</button>
    </div>
  </header>

  <aside class="planet-list chrome" aria-label="Planets"></aside>

  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
  <section class="portal-wrap chrome" aria-label="Next destination">
    <div class="portal-heading">
      <span>Next:</span>
      <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
    </div>
    <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
      <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
    </button>
  </section>

  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>
    <dl id="facts"></dl>
  </section>

  <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
  <div class="loading" aria-hidden="true">Preparing orbit…</div>
  <div class="custom-cursor" aria-hidden="true">
    <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
  </div>
</main>

<script>
(function () {
  'use strict';

  // ---------- 1. Assets ----------
  var BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
  var TO_EARTH = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
  var TO_VENUS = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
  var MERCURY = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';

  // ---------- 4. Data ----------
  var planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
  var states = {
    mars: { name: 'Mars', next: 'Earth', number: '[03]', portal: TO_EARTH, background: 'mars-background',
      facts: [['Distance:', 'About 228 million km (1.5 astronomical units).'],
              ['Year:', 'One Martian year is equal to 687 Earth days.'],
              ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
              ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']] },
    earth: { name: 'Earth', next: 'Venus', number: '[02]', portal: TO_VENUS, background: 'earth-background',
      facts: [['Distance:', '149.6 million km from the Sun.'],
              ['Year:', '365.25 Earth days.'],
              ['Temperature:', 'Average surface temperature around 15 °C.'],
              ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']] },
    venus: { name: 'Venus', next: 'Mercury', number: '[06]', image: MERCURY, background: 'venus-background',
      facts: [['Distance:', '108.2 million km from the Sun.'],
              ['Year:', '225 Earth days.'],
              ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
              ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']] }
  };
  var current = 'mars';

  // ---------- Elements ----------
  var $ = function (id) { return document.getElementById(id); };
  var experience = document.querySelector('.experience');
  var planetList = document.querySelector('.planet-list');
  var portal = $('portal');
  var portalVideo = $('portal-video');
  var portalImage = $('portal-image');
  var transitionVideo = $('transition-video');
  var portalCanvas = $('portal-canvas');
  var sceneCanvas = $('scene-canvas');
  var pctx = portalCanvas.getContext('2d');
  var sctx = sceneCanvas.getContext('2d');
  var cursor = document.querySelector('.custom-cursor');

  // ---------- Shared state ----------
  var busy = false;
  var rendered = false;
  var expansion = 0;          // 0 = window, 1 = full screen
  var maskScale = 0;          // window grows from 0 while revealing
  var canvasOpacity = 1;
  var transitionActive = false;
  var frozen = false;         // a frozen frame is held in #scene-canvas
  var rotX = 0, rotY = 0, targetX = 0, targetY = 0;
  var dpr = 1;

  // ---------- Helpers ----------
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function nextFrame() { return new Promise(function (r) { requestAnimationFrame(r); }); }

  function animateValue(setter, duration) {
    return new Promise(function (resolve) {
      var start = performance.now();
      function step(now) {
        var t = Math.min(1, (now - start) / duration);
        setter(ease(t));
        if (t < 1) requestAnimationFrame(step); else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  function retrigger(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function once(target, events, timeout) {
    return new Promise(function (resolve) {
      var done = false, timer;
      function finish(e) {
        if (done) return; done = true; clearTimeout(timer);
        events.forEach(function (ev) { target.removeEventListener(ev, finish); });
        resolve(e && e.type);
      }
      events.forEach(function (ev) { target.addEventListener(ev, finish); });
      if (timeout) timer = setTimeout(function () { finish({ type: 'timeout' }); }, timeout);
    });
  }

  // ---------- render() ----------
  function render() {
    var s = states[current];
    experience.dataset.planet = current;
    $('planet-title').textContent = s.name.toUpperCase();
    $('next-name').textContent = s.next;
    $('next-number').textContent = s.number;
    portal.setAttribute('aria-label', 'Travel to ' + s.next);

    $('facts').innerHTML = s.facts.map(function (f) {
      return '<div class="fact"><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>';
    }).join('');

    fitTitle();

    planetList.innerHTML = planets.map(function (p) {
      return '<span class="planet-item' + (p === s.name ? ' active' : '') + '">' + p + '</span>';
    }).join('');
    if (rendered) retrigger(planetList, 'is-switching');
    rendered = true;

    document.querySelectorAll('.background').forEach(function (v) {
      v.classList.toggle('is-visible', v.id === s.background);
    });

    if (s.image) {
      portalImage.style.display = '';
      portalVideo.style.display = 'none';
      portalVideo.pause();
    } else {
      portalImage.style.display = 'none';
      portalVideo.style.display = '';
      if (portalVideo.getAttribute('src') !== s.portal) { portalVideo.src = s.portal; portalVideo.load(); }
      playPortal();
    }
  }

  // Keep the giant title from pushing the facts off-screen. With the condensed Aalto face it
  // already fits at the specified size; with a wider fallback font it is scaled down to fit.
  function fitTitle() {
    var h1 = $('planet-title');
    var content = document.querySelector('.planet-content');
    h1.style.fontSize = '';
    var stacked = getComputedStyle(content).display !== 'flex';
    var avail = stacked ? content.clientWidth : content.clientWidth - $('facts').offsetWidth - 40;
    var width = h1.scrollWidth; // layout width (the -32px shift is visual only)
    if (width > avail && avail > 0) {
      h1.style.fontSize = (parseFloat(getComputedStyle(h1).fontSize) * avail / width) + 'px';
    }
  }

  function playPortal() {
    portalVideo.loop = true;
    portalVideo.muted = true;
    var p = portalVideo.play();
    if (p && p.catch) p.catch(function () {});
  }

  // ---------- 7. Canvas ----------
  function sizeCanvas(c, ctx) {
    c.width = Math.round(innerWidth * dpr);
    c.height = Math.round(innerHeight * dpr);
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    sizeCanvas(portalCanvas, pctx);
    if (!frozen) sizeCanvas(sceneCanvas, sctx);
  }

  function drawCover(ctx, media) {
    var mw = media.videoWidth || media.naturalWidth;
    var mh = media.videoHeight || media.naturalHeight;
    if (!mw || !mh) return;
    if (media.tagName === 'VIDEO' && media.readyState < 2) return;
    var scale = Math.max(innerWidth / mw, innerHeight / mh);
    var w = mw * scale, h = mh * scale;
    ctx.drawImage(media, (innerWidth - w) / 2, (innerHeight - h) / 2, w, h);
  }

  function drawShade(ctx) {
    var g = ctx.createLinearGradient(0, innerHeight * .52, 0, innerHeight);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.88)');
    ctx.fillStyle = g;
    ctx.fillRect(0, innerHeight * .52, innerWidth, innerHeight * .48);
  }

  // ~44 points around a rounded rect centred on the origin
  function roundedRectPoints(w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    var corners = [
      [w / 2 - r, -h / 2 + r, -Math.PI / 2, 0],
      [w / 2 - r, h / 2 - r, 0, Math.PI / 2],
      [-w / 2 + r, h / 2 - r, Math.PI / 2, Math.PI],
      [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5]
    ];
    var pts = [];
    corners.forEach(function (c) {
      for (var i = 0; i <= 10; i++) {
        var a = c[2] + (c[3] - c[2]) * (i / 10);
        pts.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]);
      }
    });
    return pts;
  }

  function project(pt, rx, ry, cx, cy) {
    var ax = rx * Math.PI / 180, ay = ry * Math.PI / 180;
    var xx = pt[0] * Math.cos(ay);
    var yy = pt[1] * Math.cos(ax);
    var z = pt[0] * Math.sin(ay) - pt[1] * Math.sin(ax);
    var p = 850 / (850 + z);
    return [cx + xx * p, cy + yy * p];
  }

  var last = performance.now();
  function draw(now) {
    var dt = Math.min(40, now - last); last = now;
    rotX += (targetX - rotX) * Math.min(1, dt * .009);
    rotY += (targetY - rotY) * Math.min(1, dt * .009);

    pctx.clearRect(0, 0, innerWidth, innerHeight);
    if (frozen) {
      pctx.drawImage(sceneCanvas, 0, 0, innerWidth, innerHeight);
      drawShade(pctx);
    }

    var rect = portal.getBoundingClientRect();
    var e = expansion;
    var rcx = rect.left + rect.width / 2, rcy = rect.top + rect.height / 2;
    var cx = rcx + (innerWidth / 2 - rcx) * e;
    var cy = rcy + (innerHeight / 2 - rcy) * e;
    var baseW = rect.width + (innerWidth - rect.width) * e;
    var baseH = rect.height + (innerHeight - rect.height) * e;
    var scale = e ? 1 : maskScale;
    var w = baseW * scale, h = baseH * scale;
    var radius = parseFloat(getComputedStyle(portal).borderTopLeftRadius) || 90;
    var r = radius * (1 - e) * scale;
    var rx = rotX * (1 - e), ry = rotY * (1 - e);

    if (w > 1 && h > 1) {
      var pts = roundedRectPoints(w, h, r).map(function (p) { return project(p, rx, ry, cx, cy); });
      pctx.save();
      pctx.globalAlpha = canvasOpacity;
      pctx.beginPath();
      pts.forEach(function (p, i) { if (i) pctx.lineTo(p[0], p[1]); else pctx.moveTo(p[0], p[1]); });
      pctx.closePath();
      pctx.clip();
      pctx.fillStyle = '#030303';
      pctx.fillRect(0, 0, innerWidth, innerHeight);
      var media = transitionActive ? transitionVideo : (states[current].image ? portalImage : portalVideo);
      drawCover(pctx, media);
      if (transitionActive) drawShade(pctx);
      pctx.restore();
    }
    requestAnimationFrame(draw);
  }

  // ---------- Pointer tilt ----------
  window.addEventListener('pointermove', function (e) {
    if (busy || e.pointerType === 'touch') return;
    targetY = (e.clientX / innerWidth - .5) * 37.4;
    targetX = (e.clientY / innerHeight - .5) * -33;
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', function () { targetX = 0; targetY = 0; });

  // ---------- Reveals ----------
  function revealMask() {
    retrigger(experience, 'mask-revealing');
    maskScale = 0;
    return animateValue(function (v) { maskScale = v; }, 1050);
  }
  function revealPlanetContent() { retrigger(experience, 'content-revealing'); }

  function portalMediaReady() {
    var s = states[current];
    if (s.image) {
      if (portalImage.complete && portalImage.naturalWidth) return Promise.resolve();
      return once(portalImage, ['load', 'error'], 4000);
    }
    if (portalVideo.readyState >= 3) return Promise.resolve();
    return once(portalVideo, ['canplay', 'error'], 4000);
  }

  function startExperience() {
    return portalMediaReady()
      .then(revealMask)
      .then(function () {
        document.body.classList.add('intro-ready');
        setTimeout(revealPlanetContent, 850);
      });
  }

  // ---------- 6. Preloader ----------
  function runPreloader() {
    var video = $('preloader-video');
    var value = $('preloader-value');
    var count = $('preloader-count');
    var logo = $('floating-logo');
    var finished = false, raf = 0;

    function tick() {
      if (video.duration) value.textContent = String(Math.min(100, Math.round(video.currentTime / video.duration * 100)));
      if (!finished) raf = requestAnimationFrame(tick);
    }

    function finish() {
      if (finished) return;
      finished = true;
      cancelAnimationFrame(raf);
      value.textContent = '100';
      count.classList.add('is-leaving');
      logo.classList.add('is-docked');
      $('preloader').classList.add('is-background');
      document.body.classList.add('preload-complete');
      startExperience();
      setTimeout(function () { count.remove(); }, 750);
      setTimeout(function () { logo.classList.add('is-settled'); }, 2000);
    }

    function begin() {
      video.playbackRate = Math.min(16, Math.max(.25, video.duration / 3));
      var p = video.play();
      if (p && p.catch) p.catch(finish);
      raf = requestAnimationFrame(tick);
    }

    video.addEventListener('ended', finish);
    video.addEventListener('error', finish);
    if (video.readyState >= 1) begin(); else video.addEventListener('loadedmetadata', begin, { once: true });
  }

  // ---------- 8. Travel ----------
  async function travel() {
    if (busy || current === 'venus') return;
    busy = true; targetX = 0; targetY = 0;
    var next = current === 'mars' ? 'earth' : 'venus';
    try {
      transitionVideo.src = states[current].portal;
      transitionVideo.load();
      experience.classList.add('is-loading');
      await once(transitionVideo, ['canplaythrough', 'error'], 1600);

      experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
      experience.classList.add('is-transitioning');
      transitionVideo.currentTime = 0;
      transitionVideo.playbackRate = 1.3;
      canvasOpacity = 1;
      transitionActive = true;
      await transitionVideo.play();

      await animateValue(function (v) { expansion = v; }, 1100);
      if (!transitionVideo.ended) await once(transitionVideo, ['ended']);

      // Hold the last frame in #scene-canvas
      frozen = false; sizeCanvas(sceneCanvas, sctx); frozen = true;
      sctx.clearRect(0, 0, innerWidth, innerHeight);
      drawCover(sctx, transitionVideo);

      current = next;
      experience.classList.add('is-committing');
      render();
      await nextFrame(); await nextFrame();

      transitionActive = false; expansion = 0; maskScale = 0; canvasOpacity = 1;
      experience.classList.remove('is-transitioning', 'is-committing');
      var maskReveal = revealMask();
      setTimeout(revealPlanetContent, 100);
      await maskReveal;

      setTimeout(function () {
        transitionVideo.removeAttribute('src');
        transitionVideo.load();
        busy = false;
      }, 450);
    } catch (err) {
      transitionActive = false; expansion = 0; maskScale = 1; canvasOpacity = 1;
      experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
      busy = false;
    }
  }
  portal.addEventListener('click', travel);

  // ---------- 9. Custom cursor ----------
  var mx = -100, my = -100, ox = -100, oy = -100, seen = false;
  window.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    mx = e.clientX; my = e.clientY;
    if (!seen) { seen = true; ox = mx; oy = my; }
    cursor.classList.add('is-visible');
  }, { passive: true });
  document.addEventListener('mouseleave', function () { cursor.classList.remove('is-visible'); });
  portal.addEventListener('pointerenter', function () { cursor.classList.add('is-enter'); });
  portal.addEventListener('pointerleave', function () { cursor.classList.remove('is-enter'); });

  // The whole cursor (dot, ring and label) eases toward the pointer at 0.2 per frame
  function cursorLoop() {
    ox += (mx - ox) * .2; oy += (my - oy) * .2;
    cursor.style.transform = 'translate3d(' + ox + 'px,' + oy + 'px,0)';
    requestAnimationFrame(cursorLoop);
  }

  // ---------- 12. Boot ----------
  window.addEventListener('resize', function () { resizeCanvas(); fitTitle(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
  document.querySelectorAll('.background').forEach(function (v) { v.pause(); try { v.currentTime = 0; } catch (e) {} });
  resizeCanvas();
  render();
  requestAnimationFrame(draw);
  requestAnimationFrame(cursorLoop);
  runPreloader();
})();
</script>
</body>
</html>
